name: Test published application on Android OS
on:
  push:
    paths: [.github/workflows/android-test.yml, android-test.cjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.61.1
      - run: npx playwright install android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: |
          mkdir -p ~/.android
          printf 'Vulkan = off\nGLDirectMem = on\n' > ~/.android/advancedFeatures.ini
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          ram-size: 4096M
          cores: 4
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell pm list packages com.android.chrome
            adb root
            adb wait-for-device
            adb shell 'echo "chrome --no-first-run --disable-fre --enable-features=CommandLineOnNonRootedDevices" > /data/local/tmp/chrome-command-line'
            node android-test.cjs
