name: Test published application
on:
  workflow_run:
    workflows: [Test and deploy Pages]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-test:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit, android-emulated]
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.61.1
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node browser-test.cjs
        env:
          HUB_TEST_URL: https://vervemusic.github.io/identity-hub/
          TEST_BROWSER: ${{ matrix.browser }}
      - run: node security-browser-test.cjs
        env:
          HUB_TEST_URL: https://vervemusic.github.io/identity-hub/
          TEST_BROWSER: ${{ matrix.browser }}
      - if: matrix.browser == 'chromium'
        run: node robustness-test.cjs

      - if: matrix.browser == 'webkit'
        run: node webkit-offline.cjs
